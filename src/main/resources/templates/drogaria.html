<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista de Remédios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
<div class="container">


  <h1 class="mt-5">Lista de Remédios</h1>


  <a href="/drogaria/cadastrarRemedio" class="btn btn-primary mb-3">Cadastrar Novo Remédio</a>

  <table class="table table-striped mt-3">
    <thead>
    <tr>
      <th>Código</th>
      <th>Nome</th>
      <th>Preço</th>
      <th>Data de Fabricação</th>
      <th>Data de Validade</th>
      <th>Imagem</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="remedio : ${remedios}">
      <td th:text="${remedio.codigo}"></td>
      <td th:text="${remedio.nome}"></td>
      <td th:text="'R$ ' + ${#numbers.formatDecimal(remedio.preco, 1, 'POINT', 2, 'COMMA')}"></td>
      <td th:text="${#temporals.format(remedio.dataDeFabricacao, 'dd/MM/yyyy')}"></td>
      <td th:text="${#temporals.format(remedio.dataDeValidade, 'dd/MM/yyyy')}"></td>
      <td>
        <img th:src="${remedio.urlImagem}" alt="Imagem do Remédio" style="width: 50px; height: auto;">
      </td>

      <td>

        <!--- link para editar remédio --->
        <a th:href="@{drogaria/editar/{id}(id=${remedio.codigo})}" class="btn btn-warning btn-sm me-1">

          <i class="bi bi-pencil-square"></i> Editar

        </a>

        <!--- link para excluir remédio --->

        <a th:href="@{drogaria/excluir/{id}(id=${remedio.codigo})}" class="btn btn-danger btn-sm"
        onclick="return confirm('Deseja realmente excluir?')">

          <i class="bi bi-trash"></i> Excluir

        </a>

      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
