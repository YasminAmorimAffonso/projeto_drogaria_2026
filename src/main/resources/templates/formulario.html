<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Novo Remédio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
<div class="container">
  <h1 class="mt-5">Novo Remédio</h1>
  <form th:action="${acao} == null ? '/drogaria' : ${acao}" method="post">
    <div class="mb-3">
      <label for="nome" class="form-label">Nome</label>
      <input id="nome" name="nome" th:value="${acao} != null ? ${remedio.nome}" type="text" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="preco" class="form-label">Preço</label>
      <input id="preco" name="preco" th:value="${acao} != null ? ${remedio.preco}" type="number" class="form-control" step="0.01" required>
    </div>
    <div class="mb-3">
      <label for="dataDeFabricacao" class="form-label">Data de Fabricação</label>
      <input id="dataDeFabricacao" name="dataDeFabricacao" th:value="${acao} != null ? ${remedio.dataDeFabricacao}" type="date" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="dataDeValidade" class="form-label">Data de Validade</label>
      <input id="dataDeValidade" name="dataDeValidade" th:value="${acao} != null ? ${remedio.dataDeValidade}" type="date" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="urlImagem" class="form-label">URL da Imagem</label>
      <input id="urlImagem" name="urlImagem" th:value="${acao} != null ? ${remedio.urlImagem}" type="text" class="form-control">
    </div>
    <button type="submit" class="btn btn-success">Salvar</button>
    <a href="/drogaria" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
</body>
</html>
